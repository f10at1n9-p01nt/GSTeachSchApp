<style>

:root {
    --primary: #0070f3;
    --background: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --hover: #f3f4f6;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #f5f5f5;
    color: var(--primary);
    line-height: 1.5;
}

p {
  color: black;
}

.container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
}

.card {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.card-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card-header h1 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--text);
}

.controls {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.btn-destructive {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid #ef4444;
    border-radius: 4px;
    background: transparent;
    color: #ef4444;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-destructive:hover {
    background: #fee2e2;
}

.btn-primary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--primary);
    border-radius: 4px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.card-content {
    padding: 1rem;
    /* overflow-x: auto; */
    padding-bottom: 2rem;
    overflow: hidden;
}

.time-grid {
    display: grid;
    grid-template-columns: auto repeat(7, 1fr);
    gap: 1px;
    background-color: var(--border);
    padding: 1px;
    position: relative;
}

.time-label {
    padding: 0 0.5rem;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 0.75rem;
    color: var(--text-muted);
}

.day-header {
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    text-align: center;
    padding: 0.5rem;
    font-weight: 500;
    background-color: var(--background);
}

.time-slot {
    height: 24px;
    background-color: var(--background);
    border: 1px solid var(--border);
    transition: background-color 0.2s;
    cursor: pointer;
}

.time-slot:hover {
    background-color: var(--hover);
}

.time-slot.selected {
    background-color: var(--primary);
}

.loading-state {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-muted);
    font-size: 1rem;
    /* text-align: center; */
    bottom: 1rem;
}

</style>
